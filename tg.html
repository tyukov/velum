<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>Document</title>
 
 
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">

</head>
<body>
<form id="tg">
 <div class="mb-3">
  <label class="form-label">Ваше имя</label>
  <input type="text" name="name" class="form-control" required>
</div>
<div class="mb-3">
  <label class="form-label">Ваш номер</label>
  <input type="tel" class="form-control art-stranger" name="text" required>
</div>
<div id="success" class="alert alert-success" role="alert" style="display: none"></div>
<button type="submit" class="btn btn-primary mt-4">Отправить</button>
</form>


<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
 const TOKEN = "6077432285:AAH1CHGPCzWC2-lubAZcPFsBqhjbnXoeRpw";
 const CHAT_ID = "-1001883572330";
 const URI_API = `https://api.telegram.org/bot${ TOKEN }/sendMessage`;
 const success = document.getElementById('success');
 
 document.getElementById('tg').addEventListener('submit', function(e) {
  e.preventDefault();
  
  let message = `<b>Заявка с сайта!</b>\n`;
  message += `<b>Отправитель: </b> ${ this.name.value }\n`;
  message += `<b>Номер телефона: </b> ${ this.text.value }`;
  
  axios.post(URI_API, {
   chat_id: CHAT_ID,
   parse_mode: `html`,
   text: message
  })
  .then((res) => {
   this.name.value = "";
   this.text.value = "";
   success.innerHTML = "Сообщение отправлено!";
   success.style.display = "block";
  })
  .catch((err) => {
   console.warn(err);
  })
  .finally(() => {
   console.log('Конец');
  })
 })
</script>


<!--Проверка носмера-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<script src="js/maska-nomera.js" type="text/javascript" ></script>

      <script>
$('.art-stranger').mask('+7 (999) 999-99-99');

$.fn.setCursorPosition = function(pos) {
  if ($(this).get(0).setSelectionRange) {
    $(this).get(0).setSelectionRange(pos, pos);
  } else if ($(this).get(0).createTextRange) {
    var range = $(this).get(0).createTextRange();
    range.collapse(true);
    range.moveEnd('character', pos);
    range.moveStart('character', pos);
    range.select();
  }
};


$('input[type="tel"]').click(function(){
    $(this).setCursorPosition(4);  // set position number
  });
</script>






</body>
</html>
