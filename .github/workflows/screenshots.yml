# Эталоны скриншотных тестов (tests/e2e/visual.spec.ts) снимаются здесь, в той же среде, где
# их потом сравнивает CI. Запуск: коммит в ветку (не main) с «[обновить скриншоты]» в сообщении.
# Workflow перезаписывает эталоны и коммитит их обратно в ветку — проверьте изменения в PR.
name: Эталоны скриншотов

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, '[обновить скриншоты]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots=all
        env:
          VISUAL: "1"
      - name: Закоммитить эталоны
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          git diff --cached --quiet || git commit -m "Эталоны скриншотов из CI"
          git push
