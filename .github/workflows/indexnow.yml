# После обновления сайта сообщаем поисковикам (Яндекс, Bing и др.) об изменённых страницах.
# Vercel публикует main сам за 1–2 минуты; скрипт ждёт, пока сайт ответит, и только потом отправляет адреса.
name: IndexNow

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Даём Vercel опубликовать новую версию
      - run: sleep 180
      - run: node scripts/indexnow.mjs
