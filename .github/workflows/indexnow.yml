# После деплоя на продакшен сообщаем поисковикам (Яндекс, Bing и др.) об обновлённых страницах
name: IndexNow

permissions:
  contents: read

on:
  # Vercel присылает это событие после успешного деплоя
  repository_dispatch:
    types: [vercel.deployment.success]
  # Запасной вариант: статус деплоя GitHub (окружение у Vercel называется «Production – velum»)
  deployment_status:
  workflow_dispatch:

jobs:
  ping:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
      github.event.client_payload.environment == 'production') ||
      (github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/indexnow.mjs
