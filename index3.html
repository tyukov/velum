<!DOCTYPE HTML>
<html>
 <head>
  <meta charset="utf-8">
  <title>Тег OL, атрибут start</title>
 </head>
 <body>

<form id="feedbackForm">
    <label for="message">Сообщение:</label><br>
    <textarea id="message" name="message"></textarea><br>
    <button type="submit">Отправить</button>
</form>
<div id="response"></div>

 </body>
  <script>document.getElementById("feedbackForm").addEventListener("submit", function(event) {
    event.preventDefault();
    var message = document.getElementById("message").value;
    var token = "6077432285:AAH1CHGPCzWC2-lubAZcPFsBqhjbnXoeRpw";
    var chatId = "110875668";

    var url = "https://api.telegram.org/bot" + token + "/sendMessage";
    var params = {
        chat_id: chatId,
        text: message
    };

    fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(params)
    })
    .then(response => response.json())
    .then(data => {
        if (data.ok) {
            document.getElementById("response").innerHTML = "Сообщение успешно отправлено!";
        } else {
            document.getElementById("response").innerHTML = "Ошибка отправки сообщения.";
        }
    })
    .catch(error => {
        console.error('Error:', error);
    });
});</script>
</html>
